# Place this file in /etc/nginx/sites-available/<your-domain>.conf
# and symlink it into /etc/nginx/sites-enabled/.

upstream exo_cbt_backend {
    server 127.0.0.1:9988;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN_NAME__;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN_NAME__;

    # Replace with the certificate path for your domain.
    ssl_certificate /etc/letsencrypt/live/__DOMAIN_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_NAME__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cbt-main-amd64.access.log;
    error_log /var/log/nginx/cbt-main-amd64.error.log warn;

    client_max_body_size 50m;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    location / {
        proxy_pass http://exo_cbt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
